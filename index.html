
<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071522">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Helios Klima Servis Bobby</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="app">

<header class="top">
  <button id="backBtn" class="icon hidden">‹</button>
  <div class="brandWrap">
    <div class="brand">HELIOS <span>❄</span></div>
    <div id="title">Klima servis</div>
  </div>
  <button id="homeBtn" class="icon">⌂</button>
</header>

<main id="screen"></main>

<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden"></div>

</div>

<script src="app.js"></script>
<script src="cloud.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", {scope: "./"})
      .catch(err => console.warn("Helios SW registration:", err));
  });
}
</script>

</body>
</html>
